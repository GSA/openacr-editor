name: OpenACR editor accessibility testing

on:
  pull_request:

jobs:
  build-test:
    name: Building app, run app and test for accessibility issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies.
        run: npm ci

      - name: Build app.
        run: npm run build

      - name: Run app.
        run: npm run start &

      - name: Wait for app.
        run: until curl -sf http://localhost:10001 > /dev/null; do sleep 1; done

      - name: Run accessibility test against all URLs from .pa11yci.
        run: npm run a11y-test
